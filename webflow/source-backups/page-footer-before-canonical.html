/* =========================================================
   PRAVA TEXT FIELDS LOCK v3
   Reads real fields first, ignores hidden inputs.
========================================================= */

(function () {
  function clean(v) {
    return String(v || "").replace(/\s+/g, " ").trim();
  }

  function ensureHidden(form, name) {
    var input = form.querySelector('input[type="hidden"][name="' + name + '"]');
    if (!input) {
      input = document.createElement("input");
      input.type = "hidden";
      input.name = name;
      form.appendChild(input);
    }
    return input;
  }

  function fieldValue(selectors) {
    for (var i = 0; i < selectors.length; i++) {
      var el = document.querySelector(selectors[i]);
      if (!el) continue;
      if (el.type === "hidden") continue;

      var value = clean(el.value || el.textContent);
      if (value) return value;
    }
    return "";
  }

  function visionNoteByIndex(index) {
    var fields = Array.from(document.querySelectorAll(
      '.extras-vision-phase textarea, ' +
      '.extras-vision-phase input:not([type="hidden"]), ' +
      '.vision-phase textarea, ' +
      '.vision-phase input:not([type="hidden"])'
    )).filter(function (el) {
      return !el.closest(".success-card") && !el.closest(".success-message");
    });

    return clean(fields[index] && fields[index].value);
  }

  function sync(form) {
    var data = {
      upper_finish_note:
        fieldValue([
          'textarea[name="upper_finish_note"]',
          'input:not([type="hidden"])[name="upper_finish_note"]',
          'textarea[data-field="upper_finish_note"]',
          'input:not([type="hidden"])[data-field="upper_finish_note"]',
          '[data-field="upper_finish_note"] textarea',
          '[data-field="upper_finish_note"] input:not([type="hidden"])'
        ]) || visionNoteByIndex(0),

      lower_finish_note:
        fieldValue([
          'textarea[name="lower_finish_note"]',
          'input:not([type="hidden"])[name="lower_finish_note"]',
          'textarea[data-field="lower_finish_note"]',
          'input:not([type="hidden"])[data-field="lower_finish_note"]',
          '[data-field="lower_finish_note"] textarea',
          '[data-field="lower_finish_note"] input:not([type="hidden"])'
        ]) || visionNoteByIndex(1),

      countertop_finish_note:
        fieldValue([
          'textarea[name="countertop_finish_note"]',
          'input:not([type="hidden"])[name="countertop_finish_note"]',
          'textarea[name="countertop_note_prava"]',
          'input:not([type="hidden"])[name="countertop_note_prava"]',
          'textarea[data-field="countertop_finish_note"]',
          'input:not([type="hidden"])[data-field="countertop_finish_note"]',

          'input:not([type="hidden"])[data-field="countertop_note_prava"]',
          '[data-field="countertop_finish_note"] textarea',
          '[data-field="countertop_finish_note"] input:not([type="hidden"])',
          '[data-field="countertop_note_prava"] textarea',

          'textarea[data-field="backsplash_finish_note"]',
          'input:not([type="hidden"])[data-field="backsplash_finish_note"]',
          'textarea[data-field="backsplash_note_prava"]',

          '[data-field="backsplash_finish_note"] textarea',
          '[data-field="backsplash_finish_note"] input:not([type="hidden"])',
          '[data-field="backsplash_note_prava"] textarea',

        ]),

        fieldValue([

          'input:not([type="hidden"])[name="custom_date"]',
          'textarea[data-field="custom_date"]',
          'input:not([type="hidden"])[data-field="custom_date"]',
          '[data-field="custom_date"] textarea',
          '[data-field="custom_date"] input:not([type="hidden"])',
          '.booking-custom-date'
        ])
    };

    Object.keys(data).forEach(function (key) {
      ensureHidden(form, key).value = data[key];

<script>
/* PRAVA FINAL NOTE + CUSTOM DATE PATCH v21 */

document.addEventListener("submit", function (e) {
  setTimeout(function () {
    var form = e.target;
    if (!form || !form.querySelector('[name="preview_link"]')) return;

    function clean(v) {
      return String(v || "").replace(/\s+/g, " ").trim();
    }

    function get(selectors) {
      for (var i = 0; i < selectors.length; i++) {
        var el = document.querySelector(selectors[i]);
        if (!el) continue;
        var v = clean(el.value || el.textContent);
        if (v) return v;
      }
      return "";
    }

    var customDate = get([
      '[name="custom_date"]',
      '[data-field="custom_date"] input',
      '[data-field="custom_date"] textarea',
      'input[data-field="custom_date"]',
      'textarea[data-field="custom_date"]',
      '.booking-custom-date'
    ]);

    var finalNote = get([
      '[name="final_note"]',
      '[data-field="final_note"] input',
      '[data-field="final_note"] textarea',
      'input[data-field="final_note"]',
      'textarea[data-field="final_note"]',
      '.booking-note input',
      '.booking-note textarea'
    ]);

    var input = form.querySelector('[name="preview_link"]');
    var match = String(input.value || "").match(/https?:\/\/[^\s]+/);
    if (!match) return;

    var url = new URL(match[0]);

    if (customDate) {
      url.searchParams.set("custom_date", customDate);
      url.searchParams.set("meeting_combined", customDate);

  }, 120);
}, true);

<script id="prava-card-side-reveal-v3">
(function(){
  function init(){
    var root=document.querySelector('.sf-page-prava');
    if(!root) return;

    var topCards=[];
    var lowerCards=[];

    var sketch=root.querySelector('.sticky-cad-wrap');
    if(sketch){
      sketch.classList.remove('prava-reveal-pending','prava-reveal-in');
      sketch.classList.add('prava-side-reveal','from-left');
      topCards.push(sketch);
    }

    var config=root.querySelector('.active-question-wrap');
    if(config){
      config.classList.remove('prava-reveal-pending','prava-reveal-in');
      config.classList.add('prava-side-reveal','from-right');
      topCards.push(config);
    }

    var vision=Array.from(root.querySelectorAll('.vision-group .question-wrap-vision'));
    var extras=Array.from(root.querySelectorAll('.extras-phase.extras-phase-prava .prava-extras-card'));
    lowerCards=vision.concat(extras);

    lowerCards.forEach(function(card,index){
      card.classList.remove('prava-reveal-pending','prava-reveal-in');
      card.classList.add('prava-side-reveal');
      if(index % 2 === 0) card.classList.add('from-left');
      else card.classList.add('from-right');
    });

    var allCards=topCards.concat(lowerCards);

    if(!('IntersectionObserver' in window)){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          allCards.forEach(function(card){ card.classList.add('is-visible'); });
        });
      });
      return;
    }

    var observer=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    },{
      threshold:.18,
      rootMargin:'0px 0px -4% 0px'
    });

    lowerCards.forEach(function(card){ observer.observe(card); });

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        topCards.forEach(function(card){ observer.observe(card); });
      });
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init,{once:true});
  }else{
    init();
  }
})();
</script>
<script id="prava-seo-up-reveal-v1">
(function(){
  function init(){
    var root=document.querySelector('.sf-page-prava');
    if(!root) return;

    var wrap=root.querySelector('.seo-text');
    if(!wrap) return;

    var items=Array.from(wrap.children).filter(function(el){
      return !el.classList.contains('phase-next-btn');
    });
    if(!items.length) return;

    items.forEach(function(el){
      el.classList.add('prava-up-reveal');
    });

    function showAll(){
      items.forEach(function(el){
        el.classList.add('is-visible');
      });
    }

    if(!('IntersectionObserver' in window)){
      requestAnimationFrame(function(){
        requestAnimationFrame(showAll);
      });
      return;
    }

    var observer=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        showAll();
        observer.disconnect();
      });
    },{
      threshold:.18,
      rootMargin:'0px 0px -4% 0px'
    });

    observer.observe(wrap);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init,{once:true});
  }else{
    init();
  }
})();
</script>

<script id="prava-step7-title-visibility-v3">
(function(){
  const H="#prava-appliance-heading-wrap";

  function isStep7(){
    return !!document.querySelector(
      '[data-prava-flow-step="vision"][data-prava-material-step="4"]'
    );
  }

  function setImportant(el,prop,value){
    if(el.style.getPropertyValue(prop)!==value || el.style.getPropertyPriority(prop)!=="important"){
      el.style.setProperty(prop,value,"important");
    }
  }

  function sync(){
    const h=document.querySelector(H);
    if(!h) return;

    const active=isStep7();
    setImportant(h,"display",active?"flex":"none");

    if(active){
      setImportant(h,"position","sticky");
      setImportant(h,"top","var(--prava-stage-title-top, 16px)");
      setImportant(h,"z-index","30");
    }
  }

  function scheduleSync(){
    requestAnimationFrame(sync);
    setTimeout(sync,60);
    setTimeout(sync,180);
  }

  function init(){
    sync();
    document.addEventListener("click",scheduleSync,true);
    document.addEventListener("change",scheduleSync,true);
  }

  document.readyState==="loading"
    ? document.addEventListener("DOMContentLoaded",init,{once:true})
    : init();
})();
</script>

    if(!el) return false;
    for(let n=el;n&&n!==document.body;n=n.parentElement){
      const s=getComputedStyle(n);
      if(s.display==="none"||s.visibility==="hidden") return false;
    }
    return !!el.getClientRects().length;
  }

  function setImportant(el,prop,value){
    if(el.style.getPropertyValue(prop)!==value || el.style.getPropertyPriority(prop)!=="important"){
      el.style.setProperty(prop,value,"important");
    }
  }

  function sync(){
    const h=document.querySelector(H);
    const marker=document.querySelector(STEP8_MARKER);
    if(!h) return;

    const active=isVisible(marker);
    setImportant(h,"display",active?"flex":"none");

    if(active){
      setImportant(h,"position","sticky");
      setImportant(h,"top","var(--prava-stage-title-top, 16px)");
      setImportant(h,"z-index","30");
      setImportant(h,"width","100%");
      setImportant(h,"box-sizing","border-box");
    }
  }

  function scheduleSync(){
    requestAnimationFrame(sync);
    setTimeout(sync,60);
    setTimeout(sync,180);
  }

  function init(){
    sync();
    document.addEventListener("click",scheduleSync,true);
    document.addEventListener("change",scheduleSync,true);
  }

  document.readyState==="loading"
    ? document.addEventListener("DOMContentLoaded",init,{once:true})
    : init();
})();
</script>
